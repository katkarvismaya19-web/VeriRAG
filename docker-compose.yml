services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: verirag-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: verirag
      POSTGRES_USER: verirag
      POSTGRES_PASSWORD: verirag_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verirag -d verirag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: